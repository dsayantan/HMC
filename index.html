<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>হাওড়া পুরনিগম — ওয়ার্ড ২০২৬</title>
<style>
:root{
  --red:#c8102e; --red-dk:#8d0b20; --red-lt:#f7dfe3; --red-xlt:#fdf5f6;
  --ink:#1c1a1a; --ink-2:#5a5350; --line:#e3d9d7; --paper:#fffdfc; --bg:#f4efed;
  --shadow:0 1px 2px rgba(60,20,25,.08),0 6px 18px rgba(60,20,25,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);height:100vh;height:100dvh;
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",
       "Noto Sans Bengali","Nirmala UI","Lohit Bengali",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
html[lang=bn] body{font-size:14.5px;line-height:1.6}
.page{max-width:1560px;margin:14px auto;background:var(--paper);
  border:3px solid var(--red);border-radius:6px;box-shadow:var(--shadow);overflow:hidden;
  height:calc(100vh - 28px);height:calc(100dvh - 28px);display:flex;flex-direction:column}
.mast,.controls,.kpis,footer.notes{flex:0 0 auto}

.mast{display:flex;align-items:center;gap:16px;padding:12px 20px;
  background:linear-gradient(180deg,#fff 0%,var(--red-xlt) 100%);
  border-bottom:3px double var(--red)}
.mast img{height:56px;width:auto;display:block;flex:0 0 auto;mix-blend-mode:multiply}
.mast h1{margin:0;font-size:21px;letter-spacing:.2px;color:var(--red-dk);font-weight:750;line-height:1.25}
.mast .sub{margin:3px 0 0;font-size:12.5px;color:var(--ink-2)}
.mast .spacer{flex:1}
.mast .right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:0 0 auto}
.badge{font-size:11.5px;color:var(--red-dk);border:1px solid var(--red);
  border-radius:99px;padding:4px 11px;background:#fff;white-space:nowrap}

.controls{padding:13px 20px;border-bottom:1px solid var(--line);background:#fff}
.row{display:flex;flex-wrap:wrap;gap:13px 18px;align-items:flex-end}
.row+.row{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
.fld{display:flex;flex-direction:column;gap:5px;min-width:190px}
.fld[hidden]{display:none}
.fld.half{min-width:0}
label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2)}
select,input[type=search]{font:inherit;padding:7px 9px;border:1px solid var(--line);
  border-radius:5px;background:#fff;color:var(--ink);min-width:190px}
select:focus,input:focus{outline:2px solid var(--red-lt);border-color:var(--red)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.seg button{font:inherit;padding:7px 13px;border:0;background:#fff;color:var(--ink-2);
  cursor:pointer;min-height:36px}
.seg.mini button{padding:4px 10px;min-height:28px;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{font:inherit;font-size:12.5px;padding:5px 12px;border:1px solid var(--line);
  border-radius:99px;background:#fff;color:var(--ink-2);cursor:pointer}
.chip[aria-pressed=true]{background:var(--red-lt);border-color:var(--red);color:var(--red-dk);font-weight:600}
.hint{font-size:11px;color:var(--ink-2)}
.chip .hint{color:inherit;opacity:.75}
.picker{width:100%;font-size:12.5px}
.picker>summary{cursor:pointer;color:var(--red-dk);font-weight:600;
  font-size:11.5px;text-transform:uppercase;letter-spacing:.6px}
.pbar{display:flex;align-items:center;gap:10px;margin:9px 0 4px}
.pgrp{display:flex;align-items:flex-start;gap:11px;padding:6px 0;border-top:1px dotted var(--line)}
.pgrp .plab{flex:0 0 118px;padding-top:4px;font-size:11px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--ink-2)}
.chip.sm{font-size:11.5px;padding:3px 9px}

/* The summary is the first thing worth seeing once a municipality is picked --
   who won how many wards, and the shape of its electorate -- so it stays out.
   It is compacted to a single scrollable line instead of a wrapping block of
   tiles, which costs ~44px rather than ~72.  Only the per-column picker, which
   is genuinely occasional, folds behind the More toggle.  (On phones the strip
   still folds away with everything else -- see the 640px block.) */
.kpis{display:flex;flex-wrap:nowrap;overflow-x:auto;gap:7px;padding:7px 20px;
  background:var(--red-xlt);border-bottom:1px solid var(--line);
  -webkit-overflow-scrolling:touch}
#row-pick{display:none}
body.opts-open #row-pick{display:flex}
#opts[aria-pressed=true]{background:var(--red);color:#fff}
.kpi{background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 12px;min-width:96px}
.kpi.wide{min-width:132px}
.kpi .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2)}
.kpi .v{font-size:15px;font-weight:700;color:var(--red-dk);line-height:1.3}

/* landing state: a page carrying a whole state of municipalities opens on an
   invitation to pick one, not on 16,000 booths of table */
/* Stays out of the way unless the page is actually waiting on a choice.  The
   base rule must NOT set display: an author `display:flex` beats the `hidden`
   attribute, which left the panel holding flex:1 1 auto of the page and
   squeezing the table down to nothing once a municipality was picked. */
.splash{display:none;flex:1 1 auto;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:40px 24px;text-align:center;
  color:var(--ink-2)}
.splash .big{margin:0;font-size:19px;font-weight:600;color:var(--ink);max-width:34ch}
@media (max-width:640px){.splash{padding:24px 16px}.splash .big{font-size:16.5px}}
.splash .small{margin:0;font-size:13.5px;max-width:52ch;line-height:1.6}
body.nopick .tablewrap,body.nopick .kpis{display:none}
body.nopick #splash,body.loading #splash{display:flex}
body.loading .tablewrap,body.loading .kpis{opacity:.35;pointer-events:none}
body.loading #splash .big::after{content:" …"}
.tablewrap{flex:1 1 auto;overflow:auto;min-height:0;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
table{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;z-index:3;background:var(--red-dk);color:#fff;font-size:11.5px;
  font-weight:650;letter-spacing:.3px;cursor:pointer;user-select:none}
th:hover{background:var(--red)}
/* two frozen columns: the serial number, then the ward.  The serial is a
   position counter, not data -- it always reads 1,2,3 down the page whatever the
   sort, so the row where a column crosses a threshold tells you how many rows
   are above it. */
th.sn,td.sn{position:sticky;left:0;z-index:2;background:var(--paper);
  width:38px;min-width:38px;max-width:38px;padding:6px 6px;
  text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums}
th.sn{z-index:4;background:var(--red-dk);color:#fff;cursor:default}
th.sticky,td.sticky{position:sticky;left:38px;z-index:2;background:var(--paper)}
th.sticky{z-index:4;background:var(--red-dk)}
td.t,th.t{text-align:left}
tbody tr:nth-child(even) td{background:#fbf7f6}
tbody tr:nth-child(even) td.sticky,tbody tr:nth-child(even) td.sn{background:#fbf7f6}
tr.wrow{cursor:pointer}
tr.wrow:hover td{background:var(--red-lt)}
tr.kid td{background:#f4f7fb!important;font-size:13px;color:var(--ink-2)}
tr.kid td.t{padding-left:24px}
tr.tot td{background:var(--red-lt)!important;font-weight:700;border-top:2px solid var(--red)}
.exp{display:inline-block;width:13px;color:var(--red);font-weight:700}
.ar{font-size:9px;opacity:.9}
.tag{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:99px;font-size:10px;
  background:var(--red-lt);color:var(--red-dk);border:1px solid var(--red)}
.win{font-weight:700}
.p-BJP{color:#c8102e}.p-TMC{color:#00693e}.p-CPIM{color:#b00}.p-INC{color:#1462a8}
.p-AIFB{color:#b00}.p-Others{color:var(--ink-2)}
.empty{padding:26px;text-align:center;color:var(--ink-2)}
footer.notes{padding:10px 20px;font-size:11.5px;color:var(--ink-2);
  border-top:1px solid var(--line);background:#fff;max-height:34vh;overflow:auto}
footer.notes summary{cursor:pointer;color:var(--red-dk);font-weight:600}
footer.notes .more{margin-top:7px;line-height:1.6}
footer.notes .more b{color:var(--ink)}
@media (max-width:900px){
  .mast img{height:42px}
  .mast h1{font-size:17px}
  .fld,select,input[type=search]{min-width:150px}
  td.t,th.t{max-width:190px;overflow:hidden;text-overflow:ellipsis}
}

/* ---------- phones ---------- */
@media (max-width:640px){
  body{font-size:13px}
  html[lang=bn] body{font-size:13.5px}
  .page{margin:0;border-width:0 0 2px;border-radius:0;
    height:100vh;height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  /* one line: logo, title, language.  The strapline, the spacer and the date
     badge all go -- the title already says which corporation and which year. */
  .mast{flex-wrap:nowrap;gap:9px;padding:7px 12px;align-items:center}
  .mast img{height:30px}
  .mast h1{font-size:15px;line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mast-txt{flex:1 1 auto;min-width:0}
  .mast .spacer{display:none}
  .mast .right{flex:0 0 auto;flex-direction:row;align-items:center;gap:6px;order:0}
  .badge{display:none}

  .controls{padding:9px 12px}
  .row{gap:9px 10px}
  .row+.row{margin-top:8px;padding-top:8px}
  /* one field per line, except the two little toggles which sit side by side */
  .fld{flex:1 1 100%;min-width:0}
  .fld.half{flex:1 1 calc(50% - 5px)}
  /* the AC filter and the search box are dropped on phones -- they cost two
     full rows of the little vertical space the table has.  Cleared in JS too,
     so a filter set on a wide screen cannot go on filtering invisibly. */
  .mobile-hide{display:none!important}

  /* A phone screen is mostly table.  The masthead strapline, the column chips,
     the per-column picker and the KPI strip all fold away behind the Options
     button, which frees roughly 190px -- the difference between one visible row
     and ten.  Everything is one tap away, and desktop is untouched. */
  .mast .sub{display:none}
  /* District and Municipality pair up on one line, Figures and More on the
     next, and Expand and Export fold into More -- two lines whatever the page
     carries.  The ward box stays: it is now a jump-to-ward, not a search. */
  #fld-dist,#fld-lb{flex:1 1 calc(50% - 5px);min-width:0}
  #fld-q{flex:1 1 100%;display:flex!important}
  #row-cols,#row-pick,.kpis,#fld-exp,#fld-xls{display:none}
  body.opts-open #row-cols,body.opts-open #row-pick{display:flex}
  body.opts-open #fld-exp,body.opts-open #fld-xls{display:flex}
  body.opts-open .kpis{display:flex}
  #opts[aria-pressed=true]{background:var(--red);color:#fff}
  select,input[type=search]{min-width:0;width:100%;font-size:16px;padding:8px}
  .seg{width:100%}
  .seg button{flex:1;padding:8px 6px;font-size:12.5px}
  #expand{white-space:normal;line-height:1.25}
  label{font-size:10.5px;letter-spacing:.4px}
  .chip{padding:7px 12px;min-height:34px;font-size:12px}
  .chip.sm{padding:5px 10px;min-height:30px;font-size:11.5px}
  .pgrp{flex-direction:column;gap:5px}
  .pgrp .plab{flex:none;padding-top:0}

  /* KPI tiles: one swipeable strip rather than a tall stack */
  .kpis{flex-wrap:nowrap;overflow-x:auto;padding:9px 12px;gap:7px;
    -webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
  .kpi{flex:0 0 auto;min-width:88px;scroll-snap-align:start;padding:5px 10px}
  .kpi.wide{min-width:120px}
  .kpi .k{font-size:9.5px}
  .kpi .v{font-size:14px}

  th,td{padding:5px 7px;font-size:12px}
  th{font-size:10.5px}
  td.t,th.t{max-width:150px}
  /* the frozen ward column has to stay narrow or nothing else fits */
  th.sn,td.sn{width:28px;min-width:28px;max-width:28px;padding:5px 4px;font-size:11px}
  td.sticky,th.sticky{left:28px;max-width:104px;min-width:78px}
  tr.kid td.t{padding-left:12px}
  .exp{width:11px}
  footer.notes{padding:9px 12px;font-size:11px;max-height:42vh}
}

@media (max-width:380px){
  th.sn,td.sn{width:24px;min-width:24px;max-width:24px;padding:5px 3px;font-size:10.5px}
  td.sticky,th.sticky{left:24px;max-width:88px;min-width:70px}
  .fld.half{flex:1 1 100%}
}

@media print{
  body{background:#fff;height:auto}
  .page{border:2px solid var(--red);box-shadow:none;max-width:none;height:auto;display:block}
  .controls{display:none}.tablewrap{max-height:none;overflow:visible}
  th{color:#000;background:#eee}
}

/* ward reservation, from the SEC's Form B order */
.res{font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.res.resw{color:var(--red-dk)}

</style>

mes; একটি বিধানসভা কেন্দ্র।</b> হাওড়ার প্রতিটি ওয়ার্ড পুরোপুরি একটি কেন্দ্রের মধ্যে, তাই কোনও ওয়ার্ড দু-বার আসে না।\n<b>বুথ</b> কলামে ওই কেন্দ্রের মধ্যে সেই ওয়ার্ডের পার্ট নম্বরগুলি আছে &mdash; পুরো তালিকা\nদেখতে কলামের উপর মাউস রাখুন। ওয়ার্ডে ক্লিক করলে তার বুথগুলি খুলবে; কলামের শিরোনামে\nক্লিক করলে সেই কলাম অনুযায়ী সাজানো হবে।\n<br><br>\n<b>শতাংশ বনাম সংখ্যা।</b> মূল ফাইলে জনবিন্যাস দেওয়া আছে বুথের ভোটারের শতাংশ হিসেবে।\n<b>সংখ্যা</b> বাছলে প্রতিটি শতাংশ কলাম মাথাগণনায় বদলে যায় (শতাংশ &times; ভোটার, পূর্ণসংখ্যায়),\nতাই যোগফল দু-এক জন এদিক-ওদিক হতে পারে; দলের কলামগুলি ভোটের হার ও ভোটসংখ্যার মধ্যে\nবদলায়। কলামে যে সংখ্যাটি লেখা থাকে, সাজানোও ঠিক সেটি ধরেই হয়।\n<br><br>\n<b>ওয়ার্ডের হিসাব বুথ থেকে তৈরি</b>, ভোটার-ভারিত:\n&Sigma;(শতাংশ &times; ভোটার) &divide; &Sigma;ভোটার। গড় বয়সও একইভাবে ভারিত। ভোট শুধু যোগ হয়।\n<br><br>\n<b>পদবি</b> সংখ্যায় ফিরিয়ে হিসাব করা &mdash; প্রতিটি বুথের <i>নাম (p%)</i> হয়ে যায়\np% &times; ভোটার, সব বুথ যোগ করে ওয়ার্ডের শীর্ষ দশ আবার সাজানো হয়। মূল ফাইলে প্রতিটি\nবুথের <b>প্রথম দশটি</b> পদবিই কেবল আছে, তাই ওয়ার্ডের পদবির হার আসলে <b>সর্বনিম্ন সীমা</b> &mdash;\nক্রম বোঝার পক্ষে ভাল, নিখুঁত সংখ্যা নয়। বাংলা পদবিগুলি প্রচলিত ইংরেজি বানানে লেখা হয়েছে,\nযাতে সব কেন্দ্র একসঙ্গে তুলনা করা যায়।\n<br><br>\n<b>ভোটার তালিকার সংখ্যা কম মনে হচ্ছে।</b> এই কেন্দ্রগুলিতে ফর্ম ২০-এর ভোট ভোটারসংখ্যার\n<b>প্রায় ৮৬%</b>, আর কিছু বুথে ভোট ভোটারের চেয়েও বেশি। তাই <b>ভোটার</b> সংখ্যাটিকে\nআনুমানিক ধরুন; শতাংশ কলামগুলি নিজেদের মধ্যে সঙ্গতিপূর্ণ, সেগুলিই নির্ভরযোগ্য। কয়েকটি\nকেন্দ্রে পার্ট নম্বর আর বুথ নম্বর এক নয়, তাই সেখানে <i>বুথ-স্তরে</i> জনবিন্যাস ও ভোট মেলানো\nনিরাপদ নয় &mdash; ওয়ার্ড স্তরে এই গরমিল অনেকটাই কেটে যায়।\n<br><br>\n<b>অন্যান্য</b> = যে প্রার্থীদের দল কোনও ফাইলে লেখা নেই, তার সঙ্গে সেই বৈধ ভোট যা ফর্ম ২০\nমোটে ধরেছে কিন্তু প্রার্থী অনুযায়ী ভাগ করেনি। <b>পোস্টাল ব্যালট ধরা হয়নি</b> &mdash; ফর্ম ২০\nসেগুলি কেবল কেন্দ্র-স্তরে দেয়। যেখানে বাম প্রার্থী সিপিআইএম নয়, ফরওয়ার্ড ব্লক\n(১৭২ শিবপুর), সেখানে দুটি একসঙ্গে পড়ুন।"}}};

/* Split mode: the page ships as a shell and each municipality's wards and
   booths arrive as their own file when it is chosen.  Loading is by injected
   <script>, not fetch, so the site works opened straight off the disk as well
   as over a server. */
const SPLIT = !!DATA.split;
const LOADED = new Set();
let LOADING = null;

function WARD_BUNDLE(lbi, bundle){
  for(const ac in bundle.acs){
    if(!DATA.acs[ac]) DATA.acs[ac] = bundle.acs[ac];
    else Object.assign(DATA.acs[ac].b, bundle.acs[ac].b);
  }
  for(const w of bundle.wards) DATA.wards.push(w);
  LOADED.add(lbi);
  INDEX = null;                       // new wards arrived; rebuild the index
}
window.WARD_BUNDLE = WARD_BUNDLE;

function ensureLoaded(lbi, done){
  if(!SPLIT || lbi === '' || LOADED.has(+lbi)) return done();
  const i = +lbi;
  LOADING = i;
  document.body.classList.add('loading');
  const el = document.createElement('script');
  el.src = 'data/lb' + i + '.js';
  el.onload = () => { LOADING = null; document.body.classList.remove('loading'); done(); };
  el.onerror = () => {
    LOADING = null; document.body.classList.remove('loading');
    LOADED.add(i);                    // do not retry forever
    $('#empty').textContent = t().loadFail;
    done();
  };
  document.head.appendChild(el);
}

    cover:(w,a,b,e,v)=>`${w} ward rows · ${a} assembly constituencies · ${b} booths · ${e} electors · ${v} valid votes`,
    empty:'No ward matches the current filter.',
    grp:{core:'Electors & sex', vote:'Votes', age:'Age', rel:'Religion & caste',
         lang:'Mother tongue', sur:'Top 10 surnames'},
    party:{},
    col:{
      'Total Voters':'Total Voters','Male %':'Male %','Female %':'Female %','Average Age':'Avg age',
      'Below 30 %':'Under 30 %','Age 30-44 %':'30–44 %','Age 45-59 %':'45–59 %','Age 60+ %':'60+ %',
      'Muslim %':'Muslim %','Brahmin %':'Brahmin %','Kayastha %':'Kayastha %','Bania %':'Bania %',
      'Mahishya %':'Mahishya %','OBC/Artisan %':'OBC/Artisan %','SC %':'SC %','ST %':'ST %',
      'Christian %':'Christian %','Sikh %':'Sikh %','Caste Unclassified %':'Caste uncl. %',
      'Bengali %':'Bengali %','Hindi %':'Hindi %','Urdu %':'Urdu %','Odia %':'Odia %',
      'Santali/Tribal %':'Santali %','Nepali %':'Nepali %','Punjabi %':'Punjabi %',
      'Gujarati %':'Gujarati %','Marathi %':'Marathi %','Tamil %':'Tamil %','Telugu %':'Telugu %',
      'Malayalam %':'Malayalam %','Language Unclassified %':'Lang. uncl. %',
    },
  },
};

let LANG = 'bn';                       // Bangla is the default
try{ const v = localStorage.getItem('kmcward-lang'); if(v==='en'||v==='bn') LANG = v; }catch(e){}
const t = () => T[LANG];
const acName = a => LANG==='bn' ? (a.nb || a.n) : a.n;
const lbName = i => { const l = LBS[i]; return !l ? '' : (LANG==='bn' ? (l.nb||l.n) : l.n); };
const distName = i => { const d = DISTS[i]; return !d ? '' : (LANG==='bn' ? (d.nb||d.n) : d.n); };
const partyName = p => (LANG==='bn' && t().party[p]) || p;

/* metric kinds: 0 is a head count, 3 is a mean age, the rest are percentages */
const KIND = i => i===0 ? 'count' : i===3 ? 'age' : 'pct';
/* Every column the reader can switch on is a FIELD.  A group chip flips its
   whole group; the panel underneath flips one column at a time, parties
   included.  Everything is on to begin with. */
const GROUPS = [{id:'core'},{id:'vote'},{id:'age'},{id:'rel'},{id:'lang'},{id:'sur'}];
const FIELDS = [];
const addM = (g, ci) => FIELDS.push({id:'m'+ci, g, kind:'m', ci, sk:String(ci)});
for(const ci of [0,1,2,3]) addM('core', ci);
FIELDS.push({id:'valid', g:'vote', kind:'vm', sk:'valid'});
FIELDS.push({id:'win',   g:'vote', kind:'vm', sk:'win'});
FIELDS.push({id:'marg',  g:'vote', kind:'vm', sk:'marg'});
for(let i=0;i<NP;i++)
  FIELDS.push({id:'p'+i, g:'vote', kind:'p', pi:i, sk:'p'+i});
for(const ci of [4,5,6,7]) addM('age', ci);
for(let ci=8; ci<=18; ci++) addM('rel', ci);
for(let ci=19; ci<=31; ci++) addM('lang', ci);
FIELDS.push({id:'sur', g:'sur', kind:'sur'});

const FIELD = new Map(FIELDS.map(f=>[f.id,f]));
const groupFields = g => FIELDS.filter(f=>f.g===g);
/* the short name shown in a header or a picker chip */
function fieldLabel(f, forPicker){
  if(f.kind==='m'){
    const lab = t().col[COLS[f.ci]] || COLS[f.ci];
    return (!forPicker && S.mode==='num' && KIND(f.ci)==='pct')
         ? lab.replace(/\s*%$/,'') : lab;
  }
  if(f.kind==='p')
    return partyName(PARTIES[f.pi]) + ((!forPicker && S.mode==='num') ? '' : ' %');
  if(f.id==='valid') return t().valid;
  if(f.id==='win')   return t().winner;
  if(f.id==='marg')  return t().margin;
  return t().grp.sur;
}

/* Ward reservation, from the SEC's Form B order -- keyed by the local body's
   index (blank on a single-body page) and the ward number. */
const RES = DATA.res || {}, HASRES = Object.keys(RES).length > 0;
const resOf = r => RES[(r.lbi == null ? '' : r.lbi) + '|' + r.w] || '';
/* which labels each menu choice admits */
const RESPICK = {
  any:  l => l !== '' && l !== 'GEN',   // '' is a ward with no order
  w:    l => l.endsWith('(W)'),
  sc:   l => l === 'SC' || l === 'SC(W)',
  st:   l => l === 'ST' || l === 'ST(W)',
  'SC(W)': l => l === 'SC(W)',
  'ST(W)': l => l === 'ST(W)',
  'GEN(W)': l => l === 'GEN(W)',
  gen:  l => l === 'GEN',
};

const S = {dist:'', lb:'', ac:'', res:'', mode:'pct', q:'', sort:{key:'k0', dir:1}, open:new Set(),
           on:new Set(FIELDS.map(f=>f.id))};

const $ = s => document.querySelector(s);
const fmtInt = n => n==null ? '' : Math.round(n).toLocaleString('en-IN');
const fmtPct = n => n==null ? '' : (Math.round(n*10)/10).toFixed(1);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const partyClass = p => 'p-' + String(p).replace(/[^A-Za-z]/g,'');

/* ------------------------------------------------------------------ rows */
function pairs(flat){
  const out=[]; for(let i=0;i<flat.length;i+=2) out.push([SUR[flat[i]], flat[i+1]]);
  return out;
}
/* one booth of one AC, as it sits under a ward */
function boothRow(ac, tok){
  const no = parseInt(tok,10), b = ACS[ac].b[String(no)];
  if(!b) return null;
  return {key:'b'+ac+'-'+no, no, name:b[0], m:b[1], tot:b[1][0]||0, sur:pairs(b[2]),
          v:b[3], valid:b[4], n:1, partly:/\(P\)/i.test(tok)};
}
/* elector-weighted roll-up of booth rows into one ward row; votes simply add */
function rollup(rows, key){
  const acc = new Array(COLS.length).fill(null), v = new Array(NP).fill(0);
  const sur = new Map();
  let tot=0, agew=0, agen=0, valid=0, n=0;
  for(const r of rows){
    const w = r.tot || 0; tot += w; n += r.n; valid += r.valid;
    for(let i=0;i<COLS.length;i++){
      if(KIND(i)!=='pct' || r.m[i]==null) continue;
      acc[i] = (acc[i]||0) + r.m[i]*w/100;             // percentage -> head count
    }
    if(r.m[3]!=null){ agew += r.m[3]*w; agen += w; }
    for(const [s,p] of r.sur){ if(p!=null) sur.set(s,(sur.get(s)||0)+p*w/100); }
    for(let i=0;i<NP;i++) v[i] += r.v[i];
  }
  const m = new Array(COLS.length).fill(null);
  for(let i=0;i<COLS.length;i++) if(acc[i]!=null) m[i] = tot ? acc[i]/tot*100 : null;
  m[0] = tot;
  m[3] = agen ? agew/agen : null;
  const top = [...sur.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10)
                .map(([s,c])=>[s, tot ? c/tot*100 : 0]);
  return {key, m, tot, sur:top, v, valid, n, kids:rows};
}
const winner = r => {
  let bi=0; for(let i=1;i<NP;i++) if(r.v[i]>r.v[bi]) bi=i;
  let si=-1; for(let i=0;i<NP;i++) if(i!==bi && (si<0 || r.v[i]>r.v[si])) si=i;
  return {p:PARTIES[bi], votes:r.v[bi], run:PARTIES[si], runv:r.v[si],
          margin:r.v[bi]-(si<0?0:r.v[si])};
};

/* A statewide page holds 16,000 booths.  Rolling every ward up at load would
   freeze the browser before anything appeared, so the index is cheap -- just
   which booths a ward claims -- and a ward is only costed when it is about to
   be shown.  Costed rows are cached, so sorting and expanding stay instant. */
let INDEX = null;
const COSTED = new Map();

function wardIndex(){
  if(INDEX) return INDEX;
  INDEX = DATA.wards.map(([w, ac, toks, lbi])=>({
    key:'w'+(lbi==null?'':lbi+'-')+w+'-'+ac,
    w, ac, lbi, toks, nBooth:toks.length,
    acn:(ACS[String(ac)]||{}).n || String(ac),
  }));
  return INDEX;
}

function costWard(ix){
  let r = COSTED.get(ix.key);
  if(r) return r;
  const kids = ix.toks.map(t=>boothRow(String(ix.ac), t)).filter(Boolean);
  r = rollup(kids, ix.key);
  r.w = ix.w; r.ac = ix.ac; r.acn = ix.acn; r.lbi = ix.lbi;
  r.booths = ix.toks.join(', ');
  r.nBooth = ix.nBooth;
  r.win = winner(r);
  for(const k of kids) k.win = winner(k);
  COSTED.set(ix.key, r);
  return r;
}

/* the filters only need the cheap index, so nothing is costed needlessly */
/* everything the filters do except the reservation menu, which needs this set
   to count its own choices against */
function baseIndex(){
  if(PICKFIRST && S.lb === '') return [];
  let rows = wardIndex();
  if(HASLB && S.lb !== '') rows = rows.filter(r => String(r.lbi) === S.lb);
  else if(HASDIST && S.dist !== '')
    rows = rows.filter(r => String((LBS[r.lbi]||{}).d) === S.dist);
  if(S.ac) rows = rows.filter(r => String(r.ac) === S.ac);
  return rows;
}

function filteredIndex(){
  let rows = baseIndex();
  if(S.res !== '' && RESPICK[S.res]){
    const ok = RESPICK[S.res];
    rows = rows.filter(r => ok(resOf(r)));
  }
  return rows;
}

function currentRows(){
  let rows = filteredIndex().map(costWard);
  /* the box takes a ward number and nothing else: type 14, see ward 14 */
  if(S.q !== ''){
    const n = parseInt(S.q, 10);
    rows = isNaN(n) ? [] : rows.filter(r => r.w === n);
  }
  const {key,dir} = S.sort;
  const val = r => key==='k0' ? r.w
              : key==='lb'   ? lbName(r.lbi)
              : key==='ac'   ? r.ac
              : key==='acn'  ? r.acn
              : key==='nb'   ? r.nBooth
              : key==='valid'? r.valid
              : key==='win'  ? r.win.p
              : key==='marg' ? (r.valid ? r.win.margin/r.valid*100 : null)
              : key.charAt(0)==='p' ? partyVal(r, +key.slice(1))
              : metricVal(r, +key);
  rows = rows.slice().sort((a,b)=>{
    const x=val(a), y=val(b);
    if(x==null&&y==null) return 0; if(x==null) return 1; if(y==null) return -1;
    return (typeof x==='string' ? x.localeCompare(y,'en') : x-y) * dir;
  });
  return rows;
}

/* the value the reader actually sees: a head count in Numbers mode, else the
   percentage.  Sorting and the printed cell both run through this, so a column
   always sorts on exactly what is written in it. */
function metricVal(r, ci){
  const v = r.m[ci];
  if(v==null) return null;
  return (S.mode==='num' && KIND(ci)==='pct') ? v*r.tot/100 : v;
}
function partyVal(r, pi){
  return S.mode==='num' ? r.v[pi] : (r.valid ? r.v[pi]/r.valid*100 : null);
}
function cell(r, ci){
  const v = metricVal(r, ci);
  if(v==null) return '';
  return (KIND(ci)==='count' || (S.mode==='num' && KIND(ci)==='pct')) ? fmtInt(v) : fmtPct(v);
}

/* ------------------------------------------------------------------ render */
const activeFields = () => FIELDS.filter(f=>S.on.has(f.id));

function render(){
  const fields = activeFields(), rows = currentRows();
  document.body.classList.toggle('nopick', PICKFIRST && S.lb === '');
  const ar = k => S.sort.key===k ? (S.sort.dir>0?' <span class="ar">▲</span>'
                                                :' <span class="ar">▼</span>') : '';
  const th = (k,lab,cls,tip) => `<th class="${cls||''}" data-k="${k}"`
        + (tip?` title="${esc(tip)}"`:'') + `>${esc(lab)}${ar(k)}</th>`;

  let h = '<tr>';
  h += `<th class="sn" title="${esc(t().snTip)}">#</th>`;
  h += th('k0',t().ward,'t sticky');
  if(HASLB) h += th('lb',t().lb,'t');
  h += th('ac',t().acShort);
  h += th('acn',t().acName,'t');
  h += th('nb',t().booths,'t');
  for(const f of fields){
    if(f.kind==='sur'){ for(let i=1;i<=10;i++) h += `<th class="t">${esc(t().surname(i))}</th>`; }
    else h += th(f.sk, fieldLabel(f), f.sk==='win'?'t':'', f.kind==='m'?COLS[f.ci]:'');
  }
  $('#tbl thead').innerHTML = h + '</tr>';

  const surCell = (s, tot) => `<td class="t">${s ? esc(s[0]) + ' <span class="hint">(' +
        (S.mode==='num' ? fmtInt(s[1]*tot/100) : fmtPct(s[1])+'%') + ')</span>' : ''}</td>`;

  /* one field's cell for any row -- ward, booth child or the totals line */
  const fcell = (r, f) => {
    if(f.kind==='m') return `<td>${cell(r,f.ci)}</td>`;
    if(f.kind==='p'){
      const v = partyVal(r,f.pi);
      return `<td>${v==null?'':(S.mode==='num'?fmtInt(v):fmtPct(v))}</td>`;
    }
    if(f.id==='valid') return `<td>${fmtInt(r.valid)}</td>`;
    if(f.id==='win')
      return `<td class="t win ${partyClass(r.win.p)}">${esc(partyName(r.win.p))}</td>`;
    if(f.id==='marg')
      return `<td>${r.valid ? fmtPct(r.win.margin/r.valid*100) : ''}</td>`;
    let x=''; for(let i=0;i<10;i++) x += surCell(r.sur[i], r.tot);   // f.kind==='sur'
    return x;
  };

  const line = (r, kid, sn) => {
    let x = `<tr class="${kid?'kid':'wrow'}" data-key="${r.key}">`;
    x += `<td class="sn">${kid ? '' : sn}</td>`;
    if(kid){
      x += `<td class="t sticky">${esc(t().boothN(r.no))}`
         + (r.partly?`<span class="tag">${esc(t().partly)}</span>`:'') + '</td>';
      if(HASLB) x += '<td class="t"></td>';
      x += `<td></td><td class="t">${esc(r.name||t().noSection)}</td><td class="t"></td>`;
    } else {
      const rl = resOf(r);
      x += `<td class="t sticky"><span class="exp">${S.open.has(r.key)?'▾':'▸'}</span>`
         + `${esc(t().wardN(r.w))}`
         + (rl ? ` <span class="res ${rl.endsWith('(W)')?'resw':''}">`
                 + `(${esc(rl)})</span>` : '') + '</td>';
      if(HASLB) x += `<td class="t lbcell">${esc(lbName(r.lbi))}</td>`;
      x += `<td>${r.ac}</td><td class="t">${esc(acName(ACS[String(r.ac)]))}</td>`;
      x += `<td class="t" title="${esc(r.booths)}">${r.nBooth}`
         + `<div class="hint">${esc(r.booths.length>46 ? r.booths.slice(0,46)+'…' : r.booths)}</div></td>`;
    }
    for(const f of fields) x += fcell(r, f);
    return x + '</tr>';
  };

  const body = [];
  let sn = 0;
  for(const r of rows){
    body.push(line(r, false, ++sn));
    if(S.open.has(r.key))
      for(const k of [...r.kids].sort((a,b)=>a.no-b.no)) body.push(line(k, true));
  }
  if(rows.length > 1){
    const g = rollup(rows.flatMap(r=>r.kids), 'ALL');
    g.win = winner(g);
    let x = `<tr class="tot"><td class="sn"></td>`
          + `<td class="t sticky">${esc(t().allShown)}</td>`
          + (HASLB ? `<td class="t">${esc(t().wardRows(rows.length))}</td>` : '')
          + `<td></td><td class="t">${HASLB ? '' : esc(t().wardRows(rows.length))}</td>`
          + `<td class="t">${fmtInt(g.n)}</td>`;
    for(const f of fields) x += fcell(g, f);
    body.push(x+'</tr>');
  }
  $('#tbl tbody').innerHTML = body.join('');
  $('#empty').hidden = rows.length>0;
  if(!rows.length)
    $('#empty').textContent = S.q !== '' ? t().noWard(S.q) : t().empty;
  kpis(rows);
}

function kpis(rows){
  const g = rows.length ? rollup(rows.flatMap(r=>r.kids), 'K') : null;
  const box = (k,v,w) => `<div class="kpi${w?' wide':''}"><div class="k">${esc(k)}</div>`
                       + `<div class="v">${esc(v)}</div></div>`;
  if(!g){ $('#kpis').innerHTML=''; return; }
  const win = winner(g);
  const tally = {};
  for(const r of rows) tally[r.win.p] = (tally[r.win.p]||0)+1;
  const wins = Object.entries(tally).sort((a,b)=>b[1]-a[1])
                     .map(([p,n])=>partyName(p)+' '+n).join(' · ');
  const L = t();
  $('#kpis').innerHTML = [
    box(L.kWardRows, fmtInt(rows.length)),
    box(L.kBooths, fmtInt(g.n)),
    box(L.kElectors, fmtInt(g.tot)),
    box(L.kValid, fmtInt(g.valid)),
    box(L.kTurn, g.tot ? fmtPct(g.valid/g.tot*100)+'%' : '—'),
    box(L.kWon, wins || '—', true),
    box(L.kMF, fmtPct(g.m[1])+'% / '+fmtPct(g.m[2])+'%', true),
    box(L.kAge, fmtPct(g.m[3])),
    box(L.k60, fmtPct(g.m[7])+'%'),
    box(L.kMus, fmtPct(g.m[8])+'%'),
    box(L.kSC, fmtPct(g.m[14])+'%'),
  ].join('');
}

/* The reservation menu.  Only the choices that actually match something on
   this page are offered, so a corporation with no ST seats shows no ST entry. */
function fillRes(){
  const fld = $('#fld-res');
  if(!HASRES){ fld.hidden = true; return; }
  /* Count against what is on screen, so the menu describes this municipality
     and not the whole file; a body with no order offers nothing and hides. */
  const base = baseIndex(), L = t(), have = new Set();
  for(const r of base){ const l = resOf(r); if(l) have.add(l); }
  if(!have.size){ fld.hidden = true; S.res = ''; return; }
  fld.hidden = false;
  const opts = [['', L.resAll]];
  const add = (v, lab) => {
    const ok = RESPICK[v];
    if([...have].some(ok)) opts.push([v, lab]);
  };
  add('any', L.resAny);
  add('w', L.resW);
  add('sc', L.resSC);
  add('st', L.resST);
  add('SC(W)', 'SC(W)');
  add('ST(W)', 'ST(W)');
  add('GEN(W)', 'GEN(W)');
  add('gen', L.resGen);
  const n = v => v === '' ? 0
    : new Set(base.filter(r => RESPICK[v](resOf(r))).map(r => r.w)).size;
  $('#res').innerHTML = opts.map(([v, lab]) =>
    `<option value="${esc(v)}">${esc(lab)}${v === '' ? '' : ' · ' + n(v)}</option>`
  ).join('');
  if(!opts.some(o => o[0] === S.res)) S.res = '';
  $('#res').value = S.res;
}

/* ------------------------------------------------------------------ chrome */
function fillDists(){
  if(!HASDIST) return;
  const n = new Map();
  LBS.forEach((l,i)=>{
    const d = l.d;
    if(d==null || d<0 || !l.w) return;
    if(!n.has(d)) n.set(d, new Set());
    n.get(d).add(i);
  });
  const ord = [...n.keys()].sort((a,b)=>distName(a).localeCompare(distName(b),
                LANG==='bn' ? 'bn' : 'en'));
  $('#dist').innerHTML = `<option value="">${esc(t().pickDist)}</option>`
    + ord.map(d=>`<option value="${d}">${esc(distName(d))} · ${n.get(d).size}</option>`).join('');
  $('#dist').value = S.dist;
}
function fillLBs(){
  if(!HASLB) return;
  const n = new Map();
  LBS.forEach((l,i)=>{
    if(!l.w) return;
    if(HASDIST && S.dist !== '' && String(l.d) !== S.dist) return;
    n.set(i, l.w);
  });
  const first = PICKFIRST ? t().pickLb : `${t().allLb} (${n.size})`;
  const ord = [...n.keys()].sort((a,b)=>lbName(a).localeCompare(lbName(b),
                LANG==='bn' ? 'bn' : 'en'));
  $('#lb').innerHTML = `<option value="">${esc(first)}</option>`
    + ord.map(i=>`<option value="${i}">${esc(lbName(i))} · `
        + `${esc(t().wardRows(n.get(i)))}</option>`).join('');
  if(!n.has(+S.lb)) S.lb = '';
  $('#lb').value = S.lb;
}
function fillACs(){
  const n = new Map();
  for(const r of wardIndex()){
    if(HASLB && S.lb !== '' && String(r.lbi) !== S.lb) continue;
    if(HASDIST && S.lb === '' && S.dist !== ''
       && String((LBS[r.lbi]||{}).d) !== S.dist) continue;
    n.set(r.ac, (n.get(r.ac)||0)+1);
  }
  $('#ac').innerHTML = `<option value="">${esc(t().allAc)}</option>`
    + [...n.keys()].sort((a,b)=>a-b).map(a =>
        `<option value="${a}">${a} — ${esc(acName(ACS[String(a)]))} · `
        + `${esc(t().wardRows(n.get(a)))}</option>`
      ).join('');
  if(![...n.keys()].some(a => String(a) === S.ac)) S.ac = '';
  $('#ac').value = S.ac;
}
const grpOn  = g => groupFields(g).some(f=>S.on.has(f.id));
const grpAll = g => groupFields(g).every(f=>S.on.has(f.id));

function fillGroups(){
  $('#grps').innerHTML = GROUPS.map(g =>{
      const n = groupFields(g.id).filter(f=>S.on.has(f.id)).length;
      const all = grpAll(g.id);
      return `<button class="chip" data-g="${g.id}" aria-pressed="${grpOn(g.id)}">`
        + `${esc(t().grp[g.id])}${all?'':` <span class="hint">${n}/${groupFields(g.id).length}</span>`}`
        + '</button>';
    }).join('')
    + `<span class="hint">&nbsp;${esc(t().tip)}</span>`;
  $('#picker').innerHTML = GROUPS.map(g =>
      `<div class="pgrp"><div class="plab">${esc(t().grp[g.id])}</div><div class="chips">`
      + groupFields(g.id).map(f =>
          `<button class="chip sm" data-f="${f.id}" aria-pressed="${S.on.has(f.id)}">`
          + `${esc(fieldLabel(f, true))}</button>`
        ).join('')
      + '</div></div>').join('');
}

/* ------------------------------------------------------------------ events */
$('#dist').addEventListener('change', e=>{
  S.dist = e.target.value; S.lb = ''; S.ac = ''; S.res = '';
  S.open.clear(); S.sort = {key:'k0', dir:1};
  fillLBs(); fillACs(); fillRes(); render();
});
$('#lb').addEventListener('change', e=>{
  S.lb = e.target.value; S.open.clear(); S.sort = {key:'k0', dir:1};
  ensureLoaded(S.lb, ()=>{ fillACs(); fillRes(); render(); });
});
$('#ac').addEventListener('change', e=>{
  S.ac = e.target.value; S.open.clear(); fillRes(); render();
});
$('#q').addEventListener('input', e=>{ S.q = e.target.value.trim(); render(); });
$('#res').addEventListener('change', e=>{
  S.res = e.target.value; S.open.clear(); render();
});
$('#mode').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  S.mode = b.dataset.v;
  for(const x of $('#mode').children) x.setAttribute('aria-pressed', String(x===b));
  fillGroups(); render();
});
$('#grps').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  const g = b.dataset.g, want = !grpAll(g);          // partial -> all on -> all off
  for(const f of groupFields(g)) want ? S.on.add(f.id) : S.on.delete(f.id);
  fillGroups(); render();
});
$('#picker').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  const id = b.dataset.f;
  S.on.has(id) ? S.on.delete(id) : S.on.add(id);
  fillGroups(); render();
});
$('#pick-all').addEventListener('click', ()=>{
  const all = S.on.size === FIELDS.length;
  S.on = new Set(all ? [] : FIELDS.map(f=>f.id));
  fillGroups(); render();
});
$('#export').addEventListener('click', exportRows);
$('#opts').addEventListener('click', ()=>{
  const on = document.body.classList.toggle('opts-open');
  $('#opts').setAttribute('aria-pressed', String(on));
});
$('#expand').addEventListener('click', ()=>{
  const rows = currentRows();
  if(S.open.size) S.open.clear(); else for(const r of rows) S.open.add(r.key);
  render();
});
$('#tbl').addEventListener('click', e=>{
  const th = e.target.closest('th');
  if(th && th.dataset.k){
    const k = th.dataset.k;
    const asc = (k==='k0'||k==='acn'||k==='win'||k==='ac');
    S.sort = S.sort.key===k ? {key:k, dir:-S.sort.dir} : {key:k, dir: asc?1:-1};
    render(); return;
  }
  const tr = e.target.closest('tr.wrow');
  if(tr && tr.dataset.key){
    S.open.has(tr.dataset.key) ? S.open.delete(tr.dataset.key) : S.open.add(tr.dataset.key);
    render();
  }
});

/* ------------------------------------------------------------------ export
   Writes what is actually on screen -- the chosen municipality, the ward
   filter, the columns switched on, percentage or numbers, the sort, and any
   booths opened.  UTF-8 with a byte-order mark so Excel reads the Bengali
   correctly on a double-click. */
function exportRows(){
  const fields = activeFields(), rows = currentRows(), L = t();
  const head = ['#', L.ward].concat(HASRES ? [L.res] : [])
      .concat(HASLB ? [L.lb] : [])
      .concat([L.acShort, L.acName, L.booths]);
  for(const f of fields){
    if(f.kind==='sur'){ for(let i=1;i<=10;i++) head.push(L.surname(i)); }
    else head.push(fieldLabel(f));
  }
  const out = [head];
  const plain = (r, f) => {
    if(f.kind==='m') return cell(r, f.ci);
    if(f.kind==='p'){ const v = partyVal(r,f.pi);
      return v==null ? '' : (S.mode==='num' ? Math.round(v) : fmtPct(v)); }
    if(f.id==='valid') return r.valid;
    if(f.id==='win')   return partyName(r.win.p);
    if(f.id==='marg')  return r.valid ? fmtPct(r.win.margin/r.valid*100) : '';
    return null;                                     // surnames handled below
  };
  const line = (r, kid, sn) => {
    const row = [kid ? '' : sn, kid ? L.boothN(r.no) : L.wardN(r.w)]
      .concat(HASRES ? [kid ? '' : resOf(r)] : [])
        .concat(HASLB ? [kid ? '' : lbName(r.lbi)] : [])
        .concat(kid ? ['', r.name || '', ''] : [r.ac, r.acn, r.booths]);
    for(const f of fields){
      if(f.kind==='sur'){
        for(let i=0;i<10;i++){
          const s2 = r.sur[i];
          row.push(!s2 ? '' : s2[0] + ' (' +
            (S.mode==='num' ? fmtInt(s2[1]*r.tot/100) : fmtPct(s2[1])+'%') + ')');
        }
      } else row.push(plain(r, f));
    }
    return row;
  };
  let sn = 0;
  for(const r of rows){
    out.push(line(r, false, ++sn));
    if(S.open.has(r.key))
      for(const k of [...r.kids].sort((a,b)=>a.no-b.no)) out.push(line(k, true));
  }
  const q = v => { v = (v===undefined||v===null) ? '' : String(v);
                   return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  const csv = '\ufeff' + out.map(r=>r.map(q).join(',')).join('\r\n') + '\r\n';

  const who = HASLB && S.lb !== '' ? lbName(+S.lb).replace(/[^\w-]+/g,'_')
                                   : (DATA.city||'wards').replace(/[^\w-]+/g,'_');
  const name = who + '_wards_2026' + (S.q !== '' ? '_ward' + S.q : '') + '.csv';
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ------------------------------------------------------------------ chrome */
function chrome(){
  const L = t(), I = DATA.i18n[LANG];
  document.documentElement.lang = LANG;
  document.title = I.title;
  $('#title').textContent = I.title;
  $('#subtitle').textContent = I.sub;
  $('#l-ac').textContent = L.ac;
  $('#l-lb').textContent = L.lb;
  $('#l-dist').textContent = L.dist;
  $('#fld-lb').hidden = !HASLB;
  $('#fld-dist').hidden = !HASDIST;
  $('#splash-line').textContent = L.splash;
  $('#splash-sub').textContent = L.splashSub(DISTS.length);
  $('#l-mode').textContent = L.figures;
  $('#l-exp').textContent = L.boothsLbl;
  $('#l-q').textContent = L.find;
  $('#l-res').textContent = L.res;
  fillRes();
  $('#l-cols').textContent = L.columns;
  $('#q').placeholder = L.qph;
  $('#mode').children[0].textContent = L.pct;
  $('#mode').children[1].textContent = L.num;
  $('#expand').textContent = L.expand;
  $('#l-opts').textContent = L.optsLbl;
  $('#l-xls').textContent = L.xls;
  $('#export').textContent = L.xlsBtn;
  $('#opts').textContent = L.opts;
  $('#pick-sum').textContent = L.pickSum;
  $('#pick-all').textContent = L.pickAll;
  $('#pick-hint').textContent = L.pickHint;
  $('#notes-sum').innerHTML = I.notesSum;
  $('#notes-body').innerHTML = I.notes;
  for(const b of $('#lang').children) b.setAttribute('aria-pressed', String(b.dataset.v===LANG));

  // counted from the index; costing every ward just to print a header would
  // be the slowest thing the page does
  const w = wardIndex();
  $('#cover').textContent = L.cover(
      fmtInt(w.length), fmtInt(Object.keys(ACS).length),
      fmtInt(w.reduce((a,r)=>a+r.nBooth,0)),
      fmtInt(DATA.electors||0), fmtInt(DATA.validVotes||0));
  $('#stamp').textContent = I.stamp;
}

$('#lang').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b || b.dataset.v===LANG) return;
  LANG = b.dataset.v;
  try{ localStorage.setItem('kmcward-lang', LANG); }catch(err){}
  chrome(); fillDists(); fillLBs(); fillACs(); fillGroups(); render();
});

/* The AC filter and the search box are hidden on phones (see page.css).  A
   control the reader cannot see must not keep filtering, so clear both whenever
   the viewport is that narrow -- on load and on any resize or rotation. */
const PHONE = window.matchMedia('(max-width:640px)');
function syncPhone(){
  // Only the AC filter is hidden on phones now, so only it gets cleared; the
  // municipality picker and the ward box are both still on screen.
  if(!PHONE.matches || S.ac === '') return false;
  S.ac = ''; S.open.clear();
  $('#ac').value = '';
  return true;
}
PHONE.addEventListener ? PHONE.addEventListener('change', ()=>{ syncPhone(); render(); })
                       : PHONE.addListener(()=>{ syncPhone(); render(); });

/* ------------------------------------------------------------------ boot */
syncPhone();
chrome();
fillDists(); fillLBs(); fillACs(); fillGroups(); render();

</script>
</body>
</html>
